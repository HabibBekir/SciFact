<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciCheck</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
  h1 { margin-bottom: .2rem; } .sub { color: #666; margin-top: 0; }
  textarea { width: 100%; min-height: 80px; font: inherit; padding: .6rem; box-sizing: border-box; }
  button { font: inherit; padding: .5rem 1rem; margin-top: .5rem; cursor: pointer; }
  #answer { white-space: pre-wrap; background: #f6f8fa; padding: 1rem; border-radius: 8px; min-height: 2rem; }
  .src { border-left: 3px solid #0969da; padding: .3rem .8rem; margin: .6rem 0; font-size: .9rem; }
  .src b { color: #0969da; } .meta { color: #666; font-size: .85rem; }
  #fb { display: none; margin-top: .6rem; }
</style>
</head>
<body>
<h1>SciCheck</h1>
<p class="sub">Verification of scientific claims, with sources (BEIR SciFact corpus).</p>
<textarea id="q">0-dimensional biomaterials show inductive properties.</textarea>
<button id="go">Verify</button>
<h3>Response</h3>
<div id="answer"></div>
<div id="fb">Is this response useful?
  <button data-v="1">👍</button> <button data-v="-1">👎</button> <span id="thanks"></span></div>
<p class="meta" id="meta"></p>
<h3>Sources</h3>
<div id="sources"></div>
<script>
let rid = null;
const $ = id => document.getElementById(id);
$("go").onclick = async () => {
  $("answer").textContent = ""; $("sources").innerHTML = ""; $("meta").textContent = "";
  $("fb").style.display = "none"; $("thanks").textContent = "";
  const res = await fetch("api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ question: $("q").value }) });
  if (!res.ok) { $("answer").textContent = "Erreur " + res.status; return; }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.type === "sources") {
        rid = ev.request_id;
        for (const s of ev.sources) {
          const d = document.createElement("div"); d.className = "src";
          const b = document.createElement("b"); b.textContent = `[${s.doc_id}] `;
          d.append(b, s.title, document.createElement("br"));
          const t = document.createElement("span"); t.className = "meta";
          t.textContent = `score ${s.score} — ${s.text}…`; d.append(t);
          $("sources").append(d);
        }
      } else if (ev.type === "token") { $("answer").textContent += ev.text; }
      else if (ev.type === "error") { $("answer").textContent += "\n" + ev.message; }
      else if (ev.type === "done") { $("meta").textContent = `Temps total : ${ev.latency_s} s`; $("fb").style.display = "block"; }
    }
  }
};
document.querySelectorAll("#fb button").forEach(b => b.onclick = async () => {
  await fetch("api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ request_id: rid, value: +b.dataset.v }) });
  $("thanks").textContent = "Merci !";
});
</script>
</body>
</html>
